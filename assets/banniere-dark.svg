<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" role="img" aria-label="Thomas Delhay, développeur, BTS SIO option SLAM, disponible pour une alternance ou un stage">
  <style>
    .fade { opacity: 0; animation: fade .9s ease forwards; }
    .d1 { animation-delay: .35s; } .d2 { animation-delay: .6s; } .d3 { animation-delay: .85s; } .d4 { animation-delay: 1.1s; }
    @keyframes fade { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
    .draw { stroke-dasharray: 1; stroke-dashoffset: 1; animation: draw 1.4s ease .1s forwards; }
    @keyframes draw { to { stroke-dashoffset: 0; } }
    .glow { animation: drift 14s ease-in-out infinite alternate; }
    @keyframes drift { from { transform: translate(0, 0); } to { transform: translate(-160px, 40px); } }
    .ping { transform-box: fill-box; transform-origin: center; animation: ping 2.2s ease-out infinite; }
    @keyframes ping { 0% { opacity: .7; transform: scale(1); } 100% { opacity: 0; transform: scale(2.8); } }
    .w { opacity: 0; animation: word 9s ease infinite; }
    .w1 { animation-delay: 1.2s; } .w2 { animation-delay: 4.2s; } .w3 { animation-delay: 7.2s; }
    @keyframes word { 0% { opacity: 0; transform: translateY(12px); } 5%, 30% { opacity: 1; transform: none; } 35%, 100% { opacity: 0; transform: translateY(-12px); } }
    .caret { animation: blink 1s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0; } }
    .row { opacity: 0; animation: fade .6s ease forwards; }
    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; }
      .fade, .row, .w1 { opacity: 1; }
      .draw { stroke-dashoffset: 0; }
    }
  </style>
  <defs>
    <radialGradient id="g" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#5fd38d" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#5fd38d" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="clip"><rect width="1280" height="320" rx="20"/></clipPath>
  </defs>
  <g clip-path="url(#clip)">
    <rect width="1280" height="320" fill="#0f1311"/>
    <ellipse class="glow" cx="1060" cy="40" rx="420" ry="260" fill="url(#g)"/>
  </g>
  <rect x="0.5" y="0.5" width="1279" height="319" rx="20" fill="none" stroke="#303a34"/>

  <!-- Monogramme TD : le T et le D partagent le même trait vertical, il se dessine à l'ouverture -->
  <svg x="72" y="70" width="120" height="120" viewBox="0 0 32 32">
    <rect width="32" height="32" rx="7" fill="#1c231f"/>
    <path class="draw" pathLength="1" d="M6 9H16.5A7 7 0 0 1 16.5 23H14.5M14.5 9V23" fill="none" stroke="#5fd38d" stroke-width="2.6"/>
  </svg>

  <text class="fade d1" x="232" y="124" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="60" font-weight="700" fill="#e6ebe7" letter-spacing="-1.5">Thomas Delhay</text>
  <text class="fade d2" x="236" y="168" font-family="Consolas, 'SF Mono', 'Courier New', monospace" font-size="22" fill="#5fd38d">Développeur · BTS SIO option SLAM</text>
  <text class="fade d3" x="236" y="230" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="22" fill="#9aa59e">Je construis</text>
    <text class="w w1" x="364" y="230" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="22" fill="#e6ebe7">des sites web<tspan class="caret" fill="#5fd38d"> ▍</tspan></text>
    <text class="w w2" x="364" y="230" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="22" fill="#e6ebe7">des applications de bureau<tspan class="caret" fill="#5fd38d"> ▍</tspan></text>
    <text class="w w3" x="364" y="230" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="22" fill="#e6ebe7">des outils avec de l’IA<tspan class="caret" fill="#5fd38d"> ▍</tspan></text>

  <g transform="translate(236 252)"><g class="fade d4">
    <rect width="404" height="40" rx="20" fill="#151a17" stroke="#303a34"/>
    <circle class="ping" cx="24" cy="20" r="6" fill="#5fd38d"/>
    <circle cx="24" cy="20" r="6" fill="#5fd38d"/>
    <text x="42" y="27" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="18" fill="#9aa59e">Disponible pour une alternance ou un stage</text>
  </g></g>

  <!-- Projets récents, qui apparaissent un par un -->
  <g class="fade d2">
    <rect x="820" y="56" width="388" height="208" rx="14" fill="#151a17" stroke="#303a34"/>
    <text x="848" y="90" font-family="Consolas, 'SF Mono', 'Courier New', monospace" font-size="13" fill="#9aa59e" letter-spacing="1.5">PROJETS RÉCENTS</text>
  </g>
    <g class="row" style="animation-delay:1.10s">
      <circle cx="848" cy="124" r="5" fill="#5fd38d"/>
      <text x="866" y="130" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="600" fill="#e6ebe7">Velora Board</text>
      <text x="1184" y="130" text-anchor="end" font-family="Consolas, 'SF Mono', 'Courier New', monospace" font-size="14" fill="#9aa59e">temps réel</text>
    </g>
    <g class="row" style="animation-delay:1.35s">
      <circle cx="848" cy="164" r="5" fill="#5fd38d"/>
      <text x="866" y="170" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="600" fill="#e6ebe7">Velora Protect</text>
      <text x="1184" y="170" text-anchor="end" font-family="Consolas, 'SF Mono', 'Courier New', monospace" font-size="14" fill="#9aa59e">sécurité</text>
    </g>
    <g class="row" style="animation-delay:1.60s">
      <circle cx="848" cy="204" r="5" fill="#5fd38d"/>
      <text x="866" y="210" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="600" fill="#e6ebe7">Velora Musique</text>
      <text x="1184" y="210" text-anchor="end" font-family="Consolas, 'SF Mono', 'Courier New', monospace" font-size="14" fill="#9aa59e">streaming</text>
    </g>
    <g class="row" style="animation-delay:1.85s">
      <circle cx="848" cy="244" r="5" fill="#5fd38d"/>
      <text x="866" y="250" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="600" fill="#e6ebe7">Velora Agent IA</text>
      <text x="1184" y="250" text-anchor="end" font-family="Consolas, 'SF Mono', 'Courier New', monospace" font-size="14" fill="#9aa59e">IA</text>
    </g>
</svg>
