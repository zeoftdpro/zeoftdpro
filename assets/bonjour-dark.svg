<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="500" viewBox="0 0 1280 500" role="img" aria-label="Tout a commencé en 2022 sur Garry’s Mod : j’ai appris le Lua en créant mes propres addons, puis je me suis retrouvé à gérer des serveurs de jeu et à travailler en équipe avec d’autres développeurs. Depuis, je code surtout mes propres projets : des sites, des logiciels de bureau, parfois avec un peu d’IA dedans. Ce que j’aime, c’est aller jusqu’au bout, de la première idée jusqu’à la mise en ligne. J’étudie : BTS SIO option SLAM, 1re année. Je cherche : une alternance ou un stage en développement. Je code depuis 2022.">
  <style>
    .type { animation: type 1.1s steps(32) .3s both; }
    @keyframes type { from { width: 0; } to { width: 352px; } }
    .caret { animation: blink 1s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0; } }
    .caretmove { animation: caretmove 1.1s steps(32) .3s both; }
    @keyframes caretmove { from { transform: translateX(0); } to { transform: translateX(352px); } }
    .ln { opacity: 0; animation: up .7s ease forwards; }
    @keyframes up { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
    .card { opacity: 0; animation: up .7s cubic-bezier(.2,.8,.2,1) forwards; }
    .ping { transform-box: fill-box; transform-origin: center; animation: ping 2.2s ease-out infinite; }
    @keyframes ping { 0% { opacity: .7; transform: scale(1); } 100% { opacity: 0; transform: scale(3); } }
    .draw { stroke-dasharray: 1; stroke-dashoffset: 1; animation: draw 1.8s ease 2s forwards; }
    @keyframes draw { to { stroke-dashoffset: 0; } }
    .dot { opacity: 0; transform-box: fill-box; transform-origin: center; animation: pop .5s cubic-bezier(.3,1.6,.5,1) forwards; }
    @keyframes pop { from { opacity: 0; transform: scale(.2); } to { opacity: 1; transform: none; } }
    .glow { animation: drift 16s ease-in-out infinite alternate; }
    @keyframes drift { from { transform: translate(0, 0); } to { transform: translate(-200px, 60px); } }
    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; }
      .ln, .card, .dot { opacity: 1; }
      .draw { stroke-dashoffset: 0; }
      .type { width: 352px; }
      .caretmove { transform: translateX(352px); }
    }
  </style>
  <defs>
    <radialGradient id="g" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#5fd38d" stop-opacity="0.13"/><stop offset="1" stop-color="#5fd38d" stop-opacity="0"/></radialGradient>
    <clipPath id="clip"><rect width="1280" height="500" rx="20"/></clipPath>
    <clipPath id="typed"><rect class="type" x="72" y="40" height="40" width="352"/></clipPath>
  </defs>
  <g clip-path="url(#clip)">
    <rect width="1280" height="500" fill="#0f1311"/>
    <ellipse class="glow" cx="1120" cy="60" rx="420" ry="240" fill="url(#g)"/>
  </g>
  <rect x="0.5" y="0.5" width="1279" height="499" rx="20" fill="none" stroke="#303a34"/>
  <!-- la commande se tape, puis le texte apparaît ligne par ligne, puis les trois cartes -->
  <g clip-path="url(#typed)"><text x="72" y="68" font-family="Consolas, 'SF Mono', 'Courier New', monospace" font-size="20"><tspan fill="#5fd38d">thomas@delhay</tspan><tspan fill="#9aa59e">:~$ </tspan><tspan fill="#e6ebe7">cat bonjour.txt</tspan></text></g>
  <g class="caretmove"><rect class="caret" x="76" y="51" width="11" height="22" fill="#5fd38d"/></g>
  <text class="ln" style="animation-delay:1.50s" x="72" y="136" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="21" fill="#e6ebe7">Tout a commencé en 2022 sur <tspan font-weight="700" fill="#5fd38d">Garry’s Mod</tspan> : j’ai appris le <tspan font-weight="700" fill="#5fd38d">Lua</tspan> en créant mes propres</text>
  <text class="ln" style="animation-delay:1.78s" x="72" y="170" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="21" fill="#e6ebe7">addons, puis je me suis retrouvé à gérer des serveurs de jeu et à travailler en équipe</text>
  <text class="ln" style="animation-delay:2.06s" x="72" y="204" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="21" fill="#e6ebe7">avec d’autres développeurs.</text>
  <text class="ln" style="animation-delay:2.34s" x="72" y="254" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="21" fill="#e6ebe7">Depuis, je code surtout mes propres projets : des sites, des logiciels de bureau,</text>
  <text class="ln" style="animation-delay:2.62s" x="72" y="288" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="21" fill="#e6ebe7">parfois avec un peu d’IA dedans. Ce que j’aime, c’est aller <tspan font-weight="700" fill="#5fd38d">jusqu’au bout</tspan>,</text>
  <text class="ln" style="animation-delay:2.90s" x="72" y="322" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="21" fill="#e6ebe7">de la première idée jusqu’à la mise en ligne.</text>
  <text class="ln" style="animation-delay:1.4s" x="980" y="96" font-family="Consolas, 'SF Mono', 'Courier New', monospace" font-size="15" fill="#9aa59e">// mon parcours</text>
  <path class="draw" pathLength="1" d="M1000 128 V308" stroke="#303a34" stroke-width="2"/>
  <g class="dot" style="animation-delay:2.20s"><circle cx="1000" cy="128" r="6" fill="#0f1311" stroke="#5fd38d" stroke-width="2.5"/></g>
  <text class="ln" style="animation-delay:2.20s" x="1022" y="126" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="17" fill="#e6ebe7">Addons Garry’s Mod en Lua</text>
  <text class="ln" style="animation-delay:2.20s" x="1022" y="148" font-family="Consolas, 'SF Mono', 'Courier New', monospace" font-size="14" fill="#5fd38d">2022</text>
  <g class="dot" style="animation-delay:2.65s"><circle cx="1000" cy="188" r="6" fill="#0f1311" stroke="#5fd38d" stroke-width="2.5"/></g>
  <text class="ln" style="animation-delay:2.65s" x="1022" y="194" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="17" fill="#e6ebe7">Serveurs de jeu, en équipe</text>
  <g class="dot" style="animation-delay:3.10s"><circle cx="1000" cy="248" r="6" fill="#0f1311" stroke="#5fd38d" stroke-width="2.5"/></g>
  <text class="ln" style="animation-delay:3.10s" x="1022" y="254" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="17" fill="#e6ebe7">Sites et logiciels de bureau</text>
  <g class="dot" style="animation-delay:3.55s"><circle class="ping" cx="1000" cy="308" r="6" fill="#5fd38d"/><circle cx="1000" cy="308" r="6" fill="#5fd38d" stroke="#5fd38d" stroke-width="2.5"/></g>
  <text class="ln" style="animation-delay:3.55s" x="1022" y="306" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="17" fill="#e6ebe7">BTS SIO option SLAM</text>
  <text class="ln" style="animation-delay:3.55s" x="1022" y="328" font-family="Consolas, 'SF Mono', 'Courier New', monospace" font-size="14" fill="#5fd38d">Aujourd’hui</text>
  <g class="card" style="animation-delay:3.60s">
    <rect x="72" y="368" width="360" height="104" rx="14" fill="#151a17" stroke="#303a34"/>
    <svg x="92" y="386" width="32" height="32" viewBox="0 0 32 32"><rect width="32" height="32" rx="8" fill="#1c231f"/><path d="M16 8 4 13l12 5 12-5z" fill="none" stroke="#5fd38d" stroke-width="2" stroke-linejoin="round"/><path d="M9 15.5v4.5c0 1.6 3.1 3 7 3s7-1.4 7-3v-4.5" fill="none" stroke="#5fd38d" stroke-width="2"/></svg>
    <text x="136" y="409" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="700" fill="#e6ebe7">J’étudie</text>
    
    <text x="94" y="448" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="400" fill="#9aa59e">BTS SIO option SLAM, 1re année</text>
  </g>
  <g class="card" style="animation-delay:3.82s">
    <rect x="460" y="368" width="360" height="104" rx="14" fill="#151a17" stroke="#303a34"/>
    <svg x="480" y="386" width="32" height="32" viewBox="0 0 32 32"><rect width="32" height="32" rx="8" fill="#1c231f"/><circle cx="14" cy="14" r="6.5" fill="none" stroke="#5fd38d" stroke-width="2.2"/><path d="m19 19 6 6" stroke="#5fd38d" stroke-width="2.4" stroke-linecap="round"/></svg>
    <text x="524" y="409" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="700" fill="#e6ebe7">Je cherche</text>
    <circle class="ping" cx="792" cy="403" r="5" fill="#5fd38d"/><circle cx="792" cy="403" r="5" fill="#5fd38d"/>
    <text x="482" y="448" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="400" fill="#9aa59e">Une alternance ou un stage en développement</text>
  </g>
  <g class="card" style="animation-delay:4.04s">
    <rect x="848" y="368" width="360" height="104" rx="14" fill="#151a17" stroke="#303a34"/>
    <svg x="868" y="386" width="32" height="32" viewBox="0 0 32 32"><rect width="32" height="32" rx="8" fill="#1c231f"/><path d="M11 10 5 16l6 6M21 10l6 6-6 6" fill="none" stroke="#5fd38d" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    <text x="912" y="409" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="700" fill="#e6ebe7">Je code depuis</text>
    
    <text x="870" y="448" font-family="Consolas, 'SF Mono', 'Courier New', monospace" font-size="22" font-weight="700" fill="#5fd38d">2022</text>
  </g>
</svg>
